services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fieldflow
      MYSQL_USER: fieldflow
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - fieldflow-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports:
      - "3333:3333"
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      SEED_PASSWORD: ${SEED_PASSWORD:?Set SEED_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  fieldflow-db:
